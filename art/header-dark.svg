<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Andriansyach Akbar — Enterprise Integration &amp; Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#0B1922" />
      <stop offset="100%" stop-color="#072227" />
    </linearGradient>
    <linearGradient id="accentLineDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glowEmerald" cx="84%" cy="35%" r="38%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="18%" cy="85%" r="36%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridDark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bgGradDark)" />
  <rect width="1200" height="300" rx="16" fill="url(#gridDark)" />
  <rect width="1200" height="300" rx="16" fill="url(#glowEmerald)" />
  <rect width="1200" height="300" rx="16" fill="url(#glowCyan)" />
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle circuit / API node graphic on right -->
  <g transform="translate(835, 44)" opacity="0.9">
    <rect x="0" y="0" width="315" height="212" rx="12" fill="#0F172A" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="35" cy="18" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="50" cy="18" r="4.5" fill="#10B981" opacity="0.85" />
    <line x1="12" y1="34" x2="303" y2="34" stroke="#1E293B" stroke-width="1" />

    <!-- Gateway Node -->
    <rect x="24" y="54" width="118" height="38" rx="7" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1.2" />
    <text x="83" y="77" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">Axway Gateway</text>

    <!-- ESB Node -->
    <rect x="174" y="54" width="118" height="38" rx="7" fill="#0C4A6E" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.2" />
    <text x="233" y="77" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">IBM ACE / MQ</text>

    <!-- Connector -->
    <line x1="142" y1="73" x2="174" y2="73" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="83" y1="92" x2="83" y2="124" stroke="#10B981" stroke-width="1.5" />
    <line x1="233" y1="92" x2="233" y2="124" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Service Nodes -->
    <rect x="24" y="124" width="118" height="36" rx="7" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <text x="83" y="146" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Go · Node.js</text>

    <rect x="174" y="124" width="118" height="36" rx="7" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <text x="233" y="146" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">React · Vite</text>

    <!-- Status line -->
    <rect x="24" y="174" width="268" height="24" rx="5" fill="#0B1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="38" cy="186" r="3.5" fill="#10B981" />
    <text x="50" y="190" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">PostgreSQL · OAuth2 · mTLS · OpenAPI</text>
  </g>

  <!-- Left Content -->
  <text x="58" y="68" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="1.4">// ENTERPRISE INTEGRATION · API MANAGEMENT · FULL-STACK</text>

  <text x="56" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.8">Andriansyach Akbar</text>

  <text x="58" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Enterprise Integration &amp; Full-Stack Software Engineer</text>

  <rect x="58" y="196" width="520" height="3" rx="1.5" fill="url(#accentLineDark)" />

  <text x="58" y="232" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">IBM ACE  ·  Axway API Management  ·  Go  ·  Node.js  ·  React  ·  PostgreSQL</text>

  <text x="58" y="264" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">@andriansyachakbar  ·  Indonesia</text>
</svg>
